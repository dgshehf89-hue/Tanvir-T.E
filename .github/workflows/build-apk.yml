name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Active Java Version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Temporary Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}.${{ github.run_attempt }}
          name: TANVIR GPT v${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Upload Status**: ${{ steps.upload_artifact.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path**: \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`v${{ github.run_number }}.${{ github.run_attempt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "- **GitHub Release Publishing**: ✅ Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **GitHub Release Publishing**: ⚠️ Failed or Skipped (Actions artifact \`app-debug-apk\` remains fully available)" >> $GITHUB_STEP_SUMMARY
          fi
